<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Scope is the whole app, so a home-screen icon saved from any page keeps
         order, kitchen and admin inside the app instead of showing a browser bar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The favicon follows the system's light or dark mode, not torta's own
         theme toggle. Home-screen icons are fixed images, so they are dark. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>torta</title>
    <script>
      try {
        var t = localStorage.getItem('flora-theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
