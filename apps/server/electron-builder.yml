appId: com.binarygarden.torta
productName: torta
directories:
  app: bundle
  output: release
files:
  - '**/*'
asarUnpack:
  - node_modules/@electric-sql/pglite/**
extraResources:
  - from: ../web/dist
    to: web
  - from: drizzle
    to: drizzle
  # The window icon on Linux. The installers take build/icon.png on their own.
  - from: build/icon.png
    to: icon.png
mac:
  artifactName: torta-mac-${arch}.${ext}
  # Icon Composer: light, dark and tinted on macOS 26, an .icns for older ones.
  icon: build/icon.icon
  category: public.app-category.business
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
win:
  artifactName: torta-windows.${ext}
  target:
    - target: nsis
      arch: [x64]
  azureSignOptions:
    publisherName: Eduardo Gonzalez Garcia
    endpoint: https://eus.codesigning.azure.net/
    codeSigningAccountName: bg-signing
    certificateProfileName: bg-public
linux:
  target: [AppImage]
  category: Office
  artifactName: torta-linux.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: thebinarygarden
  repo: torta
